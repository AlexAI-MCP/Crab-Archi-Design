[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crab-archi-design"
version = "0.1.0"
description = "Original-SVG-first architectural community design copilot framework."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "AlexAI-MCP" }]
dependencies = ["defusedxml>=0.7.1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
OpenCrab = "https://opencrab.sh"
Documentation = "https://opencrab.sh/dashboard"

[project.scripts]
crab-archi-design = "crab_archi_design.cli:main"
crab-archi-design-mcp = "crab_archi_design.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
