name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-preflight:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Compile
        run: |
          python -m py_compile src/crab_archi_design/cli.py src/crab_archi_design/mcp_server.py src/crab_archi_design/reference_svg_engine.py src/crab_archi_design/layout_svg_engine.py tests/test_cli.py

      - name: Test
        run: |
          python -m pytest -q

      - name: End-to-end preflight
        run: |
          crab-archi-design-mcp --help

          crab-archi-design mcp-manifest \
            --output .ci-projects/mcp_manifest.json

          crab-archi-design mcp-config \
            --output .ci-projects/mcp_runtime_config.json \
            --project-root .ci-projects

          crab-archi-design mcp-smoke \
            --config .ci-projects/mcp_runtime_config.json \
            --output-dir .ci-projects/diagnostics \
            --strict

          crab-archi-design --project-root .ci-projects/generated-job-run create-job \
            --project-id ci-generated-job \
            --source-svg examples/original_sample.svg \
            --households 900 \
            --standards examples/area_standard_sample.csv \
            --ontology-pack community_svg_topology_ontology_v2 \
            --opencrab-result-file examples/opencrab_mcp_result_sample.json \
            --opencrab-source-tool opencrab_search_documents \
            --constraint-sketch examples/constraint_sketch_sample.json \
            --prompt "Improve the greenery lounge hierarchy while preserving protected geometry." \
            --engine-adapter layout-svg-engine \
            --output .ci-projects/generated_job.json \
            --validate \
            --validation-output-dir .ci-projects/generated-job-validations \
            --strict-validation \
            --skip-preview \
            --brief

          crab-archi-design validate-job \
            --job examples/job_spec_sample.json \
            --output-dir .ci-projects/job-validations \
            --strict

          crab-archi-design run-job \
            --job examples/job_spec_sample.json \
            --output-dir .ci-projects/job-reports \
            --strict

          crab-archi-design --project-root .ci-projects workflow-run \
            --project-id ci-demo \
            --source-svg examples/original_sample.svg \
            --households 900 \
            --standards examples/area_standard_sample.csv \
            --ontology-pack community_svg_topology_ontology_v2 \
            --opencrab-result-file examples/opencrab_mcp_result_sample.json \
            --opencrab-source-tool opencrab_search_documents \
            --constraint-sketch examples/constraint_sketch_sample.json \
            --prompt "Improve the greenery lounge and fitness connection while preserving parking, cores, columns, ramps, stairs, egress, and the community shell." \
            --engine-adapter layout-svg-engine \
            --skip-preview

          crab-archi-design --project-root .ci-projects workflow-run \
            --project-id ci-demo-production \
            --source-svg examples/original_sample.svg \
            --households 900 \
            --standards examples/area_standard_sample.csv \
            --ontology-pack community_svg_topology_ontology_v2 \
            --opencrab-result-file examples/opencrab_mcp_result_sample.json \
            --opencrab-source-tool opencrab_search_documents \
            --constraint-sketch examples/constraint_sketch_sample.json \
            --sketch examples/sketch_layer_sample.json \
            --scale-mm-per-world 30 \
            --scale-evidence "Sample plan: 1 SVG world unit equals 30 mm (user-confirmed grid dimension)." \
            --prompt "Open the greenery lounge more toward the main hall and keep parking/core locked." \
            --engine-adapter same-layer-svg-engine \
            --engine-arg=--apply-program-relabels \
            --engine-arg=--apply-openings \
            --engine-arg=--apply-endpoint-moves \
            --skip-preview \
            --strict

          crab-archi-design --project-root .ci-projects revision-run \
            --project-id ci-demo-production \
            --text "Tighten the golf and sauna adjacency while keeping screen golf inside the golf cluster." \
            --engine-arg=--apply-program-relabels \
            --engine-arg=--apply-openings \
            --engine-arg=--apply-endpoint-moves \
            --skip-preview \
            --strict

          crab-archi-design --project-root .ci-projects export-package \
            --project-id ci-demo-production

          crab-archi-design --project-root .ci-projects release-audit \
            --project-id ci-demo-production \
            --zip .ci-projects/ci-demo-production/exports/ci-demo-production_export_001.zip \
            --strict

          crab-archi-design --project-root .ci-projects opencrab-request \
            --project-id ci-demo \
            --intent "Find OpenCrab precedent topology for greenery lounge, fitness, golf, wellness, hall, and support adjacency." \
            --max-results 8

          crab-archi-design --project-root .ci-projects revision-run \
            --project-id ci-demo \
            --text "Refine the greenery lounge and fitness connection while keeping protected geometry locked." \
            --engine-adapter layout-svg-engine \
            --skip-preview

          crab-archi-design --project-root .ci-projects export-package \
            --project-id ci-demo

          crab-archi-design --project-root .ci-projects verify-package \
            --zip .ci-projects/ci-demo/exports/ci-demo_export_001.zip \
            --strict

          crab-archi-design --project-root .ci-projects doctor \
            --project-id ci-demo \
            --zip .ci-projects/ci-demo/exports/ci-demo_export_001.zip \
            --strict

          crab-archi-design --project-root .ci-projects release-audit \
            --project-id ci-demo \
            --zip .ci-projects/ci-demo/exports/ci-demo_export_001.zip \
            --strict

          examples/run_quickstart.sh .ci-projects/quickstart ci-quickstart
