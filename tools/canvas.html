<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Crab Archi Design — Live Canvas</title>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}
</script>
<style>
  :root { --bg:#14171c; --panel:#1d2129; --line:#2c313b; --text:#e6e9ef; --dim:#8a93a3; --accent:#4da3ff; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 -apple-system, "Apple SD Gothic Neo", sans-serif; background:var(--bg); color:var(--text); display:flex; flex-direction:column; height:100vh; }
  header { display:flex; gap:8px; align-items:center; padding:8px 12px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header input[type=text] { background:var(--bg); border:1px solid var(--line); color:var(--text); border-radius:6px; padding:6px 8px; }
  #svgPath { width:340px; } #prompt { flex:1; min-width:220px; }
  button { background:var(--bg); border:1px solid var(--line); color:var(--text); border-radius:6px; padding:6px 10px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.active { background:var(--accent); color:#08121f; border-color:var(--accent); }
  select { background:var(--bg); border:1px solid var(--line); color:var(--text); border-radius:6px; padding:6px; }
  main { flex:1; display:flex; min-height:0; }
  #workspace { flex:1; min-width:0; display:flex; flex-direction:column; }
  #viewport { flex:1; min-height:180px; position:relative; overflow:hidden; background:#fff; }
  #stage svg, #overlay { position:absolute; inset:0; width:100%; height:100%; }
  #overlay { pointer-events:none; }
  aside { width:240px; flex:none; background:var(--panel); border-left:1px solid var(--line); padding:10px; overflow-y:auto; font-size:13px; }
  #viewport { min-width:200px; }
  @media (max-width: 700px) { aside { display:none; } }
  aside h3 { margin:6px 0; font-size:12px; text-transform:uppercase; color:var(--dim); }
  #log { white-space:pre-wrap; color:var(--dim); font-size:12px; }
  footer { padding:4px 12px; background:var(--panel); border-top:1px solid var(--line); color:var(--dim); font-size:12px; display:flex; justify-content:space-between; }
  .sel { outline:2px dashed var(--accent); outline-offset:1px; }
  .toolbar-group { display:flex; gap:4px; align-items:center; padding-right:8px; border-right:1px solid var(--line); }
  #threePane { position:relative; flex:0 0 46%; min-height:260px; overflow:hidden; background:#11151b;
    border-bottom:1px solid var(--line); }
  #threePane.hidden { display:none; }
  #threeCanvas { display:block; width:100%; height:100%; touch-action:none; }
  .three-toolbar { position:absolute; z-index:4; top:8px; left:8px; right:8px; display:flex; flex-wrap:wrap;
    align-items:center; gap:5px; padding:7px; border:1px solid rgba(255,255,255,.12); border-radius:8px;
    background:rgba(20,23,28,.88); backdrop-filter:blur(8px); }
  .three-toolbar label { display:flex; align-items:center; gap:4px; font-size:11px; color:var(--dim); }
  .three-toolbar input[type=number] { width:66px; }
  .three-toolbar input[type=text] { min-width:260px; flex:1; }
  .three-toolbar input, .three-toolbar select { background:var(--bg); border:1px solid var(--line); color:var(--text);
    border-radius:5px; padding:4px 6px; }
  .three-toolbar button { padding:4px 8px; font-size:12px; }
  #threeStatus { position:absolute; left:10px; bottom:8px; z-index:4; color:#cbd5e1; font:11px/1.4 ui-monospace, monospace;
    background:rgba(0,0,0,.62); padding:4px 7px; border-radius:5px; pointer-events:none; }
  #threeSelection { position:absolute; right:10px; bottom:8px; z-index:4; color:#7dd3fc; font:11px/1.4 ui-monospace, monospace;
    background:rgba(0,0,0,.62); padding:4px 7px; border-radius:5px; pointer-events:none; }
</style>
</head>
<body>
<header>
  <div class="toolbar-group">
    <input id="svgPath" type="text" placeholder="SVG 파일 절대 경로">
    <button id="btnOpen">열기</button>
    <button id="btnBrowse">📂 찾아보기</button>
    <input type="file" id="filePick" accept=".svg,image/svg+xml" style="display:none">
    <button id="btnSave">저장</button>
    <button id="btnDxf" title="DXF로 내보내기 (AutoCAD 호환)">⬇ DXF</button>
    <button id="btnUndo">↩ 실행취소</button>
    <button id="btnFit">전체보기</button>
    <button id="btnSnap" class="active">스냅</button>
    <button id="btn3d" title="현재 SVG를 읽기 전용 Three.js 3D로 보기">◫ 3D</button>
  </div>
  <div class="toolbar-group" id="tools">
    <button data-tool="select" class="active">선택</button>
    <button data-tool="pan">팬</button>
    <button data-tool="line">직선</button>
    <button data-tool="polyline">폴리라인</button>
    <button data-tool="curve">곡선</button>
    <button data-tool="rect">사각형</button>
    <button data-tool="ellipse">원</button>
    <button data-tool="text">텍스트</button>
    <button data-tool="zone">구역</button>
    <button data-tool="copy">복사</button>
    <button data-tool="stylecopy">스타일복사</button>
  </div>
  <div class="toolbar-group">
    <select id="zoneMode">
      <option value="community_shell">외곽 쉘</option>
      <option value="no_go_zone">금지 구역</option>
      <option value="protect_zone">보호 구역</option>
      <option value="lock_boundary">고정 경계</option>
      <option value="mutable_zone">가변 구역</option>
      <option value="projectable_zone">확장 가능</option>
    </select>
    <input id="strokeColor" type="color" value="#d62728" title="선 색">
    <input id="strokeWidth" type="number" value="2" min="0.5" step="0.5" style="width:56px" title="선 두께">
    <button id="btnDelete">🗑 선택삭제</button>
  </div>
  <div class="toolbar-group" id="xformGroup" title="선택한 오브젝트 변형">
    <button id="btnMove" title="정확 이동 (드래그로도 이동 가능)">⤒ 이동</button>
    <button id="btnRotate" title="선택 중심 기준 회전">⟳ 회전</button>
    <button id="btnScale" title="선택 중심 기준 배율">⤢ 스케일</button>
    <button id="btnDup" title="선택 복제">⧉ 복제</button>
    <button id="btnArray" title="행×열 배열 복사">⠿ 배열</button>
  </div>
  <input id="prompt" type="text" placeholder="메시지(에이전트에게) 또는 재생성 프롬프트">
  <button id="btnSend">💬 에이전트에게</button>
  <button id="btnRegen">재생성</button>
</header>
<main>
  <div id="workspace">
    <div id="threePane" class="hidden">
      <canvas id="threeCanvas"></canvas>
      <div class="three-toolbar">
        <button id="btn3dRebuild">↻ 3D 갱신</button>
        <label>층고 mm <input id="threeWallHeight" type="number" value="2700" min="300" step="100"></label>
        <label>벽두께 mm <input id="threeWallThickness" type="number" value="150" min="20" step="10"></label>
        <label>슬래브 mm <input id="threeSlab" type="number" value="150" min="0" step="10"></label>
        <label>가구높이 mm <input id="threeFurnitureHeight" type="number" value="750" min="50" step="50"></label>
        <label><input id="threeShowWalls" type="checkbox" checked>벽</label>
        <label><input id="threeShowColumns" type="checkbox" checked>기둥</label>
        <label><input id="threeShowFurniture" type="checkbox" checked>가구</label>
        <label><input id="threeShowOverlay" type="checkbox" checked>2D 정합선</label>
        <select id="threeFinish" title="선택한 3D 부재 또는 전체 벽 마감">
          <option value="plaster">화이트 플라스터</option>
          <option value="concrete">노출 콘크리트</option>
          <option value="wood">우드</option>
          <option value="metal">메탈</option>
          <option value="glass">유리</option>
          <option value="custom">사용자 색상</option>
        </select>
        <input id="threeColor" type="color" value="#d8d4ca" title="마감 색상">
        <button id="btn3dApplyFinish">마감 적용</button>
        <button id="btn3dPerspective">사선뷰</button>
        <button id="btn3dTop">평면뷰</button>
        <button id="btn3dEye">아이레벨</button>
        <button id="btn3dFit">Fit</button>
        <input id="threeRenderPrompt" type="text" placeholder="렌더 요청: 재질, 조명, 시간대, 분위기…">
        <button id="btn3dSend" class="active">컷을 Codex로</button>
        <button id="btn3dCopy">캡처 복사</button>
        <button id="btn3dCopyPrompt">렌더 요청 복사</button>
      </div>
      <div id="threeStatus">3D 준비 중…</div>
      <div id="threeSelection">선택: 전체 벽</div>
    </div>
    <div id="viewport"><div id="stage"></div><svg id="overlay"></svg></div>
  </div>
  <aside>
    <h3>선택</h3><div id="selInfo">없음</div>
    <h3>구역</h3><div id="zoneList">없음</div>
    <h3>로그</h3><div id="log"></div>
  </aside>
</main>
<footer><span id="status">서버 연결 중…</span><span id="hint">휠 줌 · Space/Alt+드래그 팬 · Ctrl/Shift+클릭 복수선택 · Delete키/🗑 삭제 · 더블클릭 다점 완료 · Esc 취소</span></footer>
<script>
const S = { rev:-1, tool:'select', pts:[], selected:[], styleSource:null, copySource:null, drawing:false };
const $ = id => document.getElementById(id);
const log = m => { $('log').textContent = (m + "\n" + $('log').textContent).slice(0, 4000); };

async function api(route, body, method) {
  const opt = body !== undefined ? { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) } : { method: method||'GET' };
  const res = await fetch(route, opt);
  return res.json();
}
const op = (name, params) => api('/api/op', { op:name, params }).then(r => {
  if (r.status==='error') log('오류: '+r.error);
  else log(`✓ ${name} 추가됨 (${r.cid || (r.deleted ? r.deleted.length + '개 삭제' : '')})`);
  poll(true); return r;
}).catch(e => { log('서버 요청 실패: ' + e); });

async function poll(force) {
  try {
    const doc = await api('/api/doc?rev=' + (force ? -1 : S.rev));
    if (doc.status === 'ok') {
      S.rev = doc.revision;
      $('stage').innerHTML = doc.svg;
      const svg = $('stage').querySelector('svg');
      if (svg) {
        svg.removeAttribute('width'); svg.removeAttribute('height');
        if (!S.docBox) S.docBox = (svg.getAttribute('viewBox') || '0 0 1000 1000').split(/[\s,]+/).map(Number);
        if (doc.source_path !== S.sourcePath) { S.sourcePath = doc.source_path; S.view = null;
          S.docBox = (svg.getAttribute('viewBox') || '0 0 1000 1000').split(/[\s,]+/).map(Number); }
        applyView();
      }
      $('status').textContent = `rev ${doc.revision} · 요소 ${doc.element_count} · ${doc.source_path||'(파일 미지정)'}`;
      S.endpoints = null;  // 스냅 캐시 무효화
      refreshZones(); restoreSelection();
      window.dispatchEvent(new CustomEvent('crab-canvas-revision', { detail:{ revision:S.rev } }));
    } else if (doc.status === 'empty') { $('status').textContent = 'SVG를 열어주세요'; }
  } catch (e) { $('status').textContent = '서버 연결 끊김'; }
}
setInterval(() => { if (!S.drawing && !S.panning) poll(); }, 1500);
poll();

// ---- zoom / pan (viewBox is user-owned; polling never resets it) ----
function applyView() {
  const svg = $('stage').querySelector('svg'); if (!svg) return;
  const v = S.view || S.docBox; if (!v) return;
  const box = v.join(' ');
  svg.setAttribute('viewBox', box);
  $('overlay').setAttribute('viewBox', box);
  $('overlay').setAttribute('preserveAspectRatio', 'xMidYMid meet');
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
}
function zoomAt(cx, cy, factor) {
  const v = (S.view || S.docBox); if (!v) return;
  const [x, y, w, h] = v;
  const nw = Math.max(10, w * factor), nh = Math.max(10, h * factor);
  S.view = [cx - (cx - x) * (nw / w), cy - (cy - y) * (nh / h), nw, nh];
  applyView();
  syncSession();
}
$('viewport').addEventListener('wheel', evt => {
  evt.preventDefault();
  const p = svgPoint(evt); if (!p) return;
  zoomAt(p[0], p[1], evt.deltaY > 0 ? 1.15 : 1/1.15);
}, { passive: false });
// ---- 러버밴드 선택: 선택 도구에서 드래그 → 박스 안 요소 일괄 선택 ----
$('viewport').addEventListener('pointerdown', evt => {
  if (evt.button !== 0 || S.tool !== 'select' || evt.altKey || S.spaceDown) return;
  const startX = evt.clientX, startY = evt.clientY;
  const additive = evt.shiftKey || evt.ctrlKey || evt.metaKey;
  const ns = 'http://www.w3.org/2000/svg';
  let band = null, dragged = false;
  const move = e2 => {
    if (!dragged && Math.hypot(e2.clientX-startX, e2.clientY-startY) < 5) return;
    dragged = true;
    const svg = $('stage').querySelector('svg'); if (!svg) return;
    const inv = svg.getScreenCTM().inverse();
    const p = svg.createSVGPoint();
    p.x = startX; p.y = startY; const a = p.matrixTransform(inv);
    p.x = e2.clientX; p.y = e2.clientY; const b = p.matrixTransform(inv);
    if (!band) { band = document.createElementNS(ns, 'rect');
      band.setAttribute('stroke', '#4da3ff'); band.setAttribute('fill', '#4da3ff');
      band.setAttribute('fill-opacity', '0.08'); band.setAttribute('stroke-dasharray', '4 3');
      const view = S.view || S.docBox; band.setAttribute('stroke-width', view ? view[2]/600 : 1);
      $('overlay').appendChild(band); }
    band.setAttribute('x', Math.min(a.x, b.x)); band.setAttribute('y', Math.min(a.y, b.y));
    band.setAttribute('width', Math.abs(b.x - a.x)); band.setAttribute('height', Math.abs(b.y - a.y));
  };
  const up = e2 => {
    window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up);
    if (band) band.remove();
    if (!dragged) return;                       // 클릭이면 기존 클릭선택에 맡김
    S.suppressClick = true;                     // 드래그 직후의 click 이벤트 무시
    const x0 = Math.min(startX, e2.clientX), x1 = Math.max(startX, e2.clientX);
    const y0 = Math.min(startY, e2.clientY), y1 = Math.max(startY, e2.clientY);
    // 일괄 처리: 요소마다 select() 호출 금지 (DOM 재검색·서버 POST 폭주 → 프리즈)
    const picked = [];
    let capped = false;
    for (const el of $('stage').querySelectorAll('[data-cid]')) {
      if (el.tagName === 'g') continue;
      const r = el.getBoundingClientRect();
      if ((r.width > 0.01 || r.height > 0.01) &&
          r.left >= x0 && r.right <= x1 && r.top >= y0 && r.bottom <= y1) {
        picked.push(el);
        if (picked.length >= 800) { capped = true; break; }
      }
    }
    if (!additive) { S.selected = []; $('stage').querySelectorAll('.sel').forEach(e=>e.classList.remove('sel')); }
    const have = new Set(S.selected);
    for (const el of picked) {
      const cid = el.getAttribute('data-cid');
      if (!have.has(cid)) { have.add(cid); S.selected.push(cid); el.classList.add('sel'); }
    }
    $('selInfo').textContent = S.selected.length > 12
      ? `${S.selected.length}개 선택됨` : (S.selected.join(', ') || '없음');
    syncSession(true);
    log(capped ? `박스 선택 800개 상한 도달 — 더 좁게 드래그하세요`
               : `박스 선택: ${picked.length}개 (합계 ${S.selected.length}) — 완전히 포함된 요소만`);
  };
  window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
});

$('viewport').addEventListener('pointerdown', evt => {
  const midOrSpace = evt.button === 1 || (evt.button === 0 && (S.tool === 'pan' || evt.altKey || S.spaceDown));
  if (!midOrSpace) return;
  evt.preventDefault();
  const svg0 = $('stage').querySelector('svg'); if (!svg0) return;
  // 드래그 시작 시점의 변환 행렬로 고정 — viewBox를 갱신하면서 다시 읽으면 이동이 상쇄된다
  const ctm0 = svg0.getScreenCTM().inverse();
  const pt0 = svg0.createSVGPoint(); pt0.x = evt.clientX; pt0.y = evt.clientY;
  const start = pt0.matrixTransform(ctm0);
  const v0 = (S.view || S.docBox).slice();
  S.panning = true;
  const move = e2 => {
    const pt = svg0.createSVGPoint(); pt.x = e2.clientX; pt.y = e2.clientY;
    const p2 = pt.matrixTransform(ctm0);
    S.view = [v0[0] - (p2.x - start.x), v0[1] - (p2.y - start.y), v0[2], v0[3]];
    applyView();
  };
  const up = () => { S.panning = false; syncSession(); window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
  window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
});
document.addEventListener('keydown', e => { if (e.code === 'Space' && document.activeElement.tagName !== 'INPUT') { S.spaceDown = true; e.preventDefault(); } });
document.addEventListener('keyup', e => { if (e.code === 'Space') S.spaceDown = false; });

async function refreshZones() {
  const z = await api('/api/zones');
  $('zoneList').innerHTML = (z.zones||[]).map(x => `${x.mode} <small>(${x.cid})</small>`).join('<br>') || '없음';
}

function svgPoint(evt) {
  const svg = $('stage').querySelector('svg'); if (!svg) return null;
  const pt = svg.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  return [Math.round(p.x*100)/100, Math.round(p.y*100)/100];
}

// ---- snapping: endpoint > orthogonal(Shift) > grid ----
S.snap = true; S.endpoints = null;
function rebuildEndpoints() {
  const eps = [];
  $('stage').querySelectorAll('line').forEach(l => {
    eps.push([+l.getAttribute('x1'), +l.getAttribute('y1')], [+l.getAttribute('x2'), +l.getAttribute('y2')]);
    if (eps.length > 60000) return;
  });
  S.endpoints = eps;
}
function snapPoint(p, evt) {
  if (!S.snap || !p) return p;
  const svg = $('stage').querySelector('svg');
  const view = (S.view || S.docBox);
  const tolUnits = view ? view[2] / $('viewport').clientWidth * 10 : 2;  // ≈10px
  if (S.endpoints === null) rebuildEndpoints();
  let best = null, bd = tolUnits;
  for (const [ex, ey] of S.endpoints) {
    const d = Math.hypot(ex - p[0], ey - p[1]);
    if (d < bd) { bd = d; best = [ex, ey]; }
  }
  if (best) return best;
  if (evt && evt.shiftKey && S.pts.length) {   // orthogonal from last point
    const last = S.pts[S.pts.length - 1];
    return Math.abs(p[0]-last[0]) > Math.abs(p[1]-last[1]) ? [p[0], last[1]] : [last[0], p[1]];
  }
  return [Math.round(p[0]), Math.round(p[1])];  // 1-unit grid
}
const style = () => ({ stroke: $('strokeColor').value, 'stroke-width': $('strokeWidth').value, fill: 'none' });

// ---- 에이전트 양방향 채널 ----
S.noticeSeq = 0;
let syncTimer = null;
function syncSession(immediate) {  // 선택은 즉시, 뷰포트는 250ms 스로틀
  const send = () => api('/api/session/update', { selection: S.selected, viewport: S.view || S.docBox }).catch(()=>{});
  clearTimeout(syncTimer);
  if (immediate) send(); else syncTimer = setTimeout(send, 250);
}
async function pollNotices() {     // 에이전트 알림·포인터 수신
  try {
    const r = await api('/api/session/browser?since=' + S.noticeSeq);
    for (const n of r.notices || []) {
      S.noticeSeq = n.seq;
      if (n.text) log('🤖 ' + n.text);
      if (n.pointer) showPointer(n.pointer[0], n.pointer[1]);
    }
  } catch (e) {}
}
setInterval(pollNotices, 1500);
function showPointer(x, y) {       // 화면에 4초간 깜빡이는 마커
  const ns = 'http://www.w3.org/2000/svg';
  const o = $('overlay');
  const g = document.createElementNS(ns, 'g');
  const view = S.view || S.docBox; const r = view ? view[2]/40 : 20;
  for (const [rad, w] of [[r, 3], [r*0.55, 2]]) {
    const c = document.createElementNS(ns, 'circle');
    c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', rad);
    c.setAttribute('stroke', '#ff3b30'); c.setAttribute('fill', 'none'); c.setAttribute('stroke-width', w);
    g.appendChild(c);
  }
  o.appendChild(g);
  let on = true;
  const blink = setInterval(() => { g.style.opacity = (on = !on) ? 1 : 0.15; }, 350);
  setTimeout(() => { clearInterval(blink); g.remove(); }, 4500);
}

function restoreSelection() {
  if (S.selected.length) {                       // 단일 패스: cid별 전체 DOM 검색 금지
    const want = new Set(S.selected);
    const found = new Set();
    for (const el of $('stage').querySelectorAll('[data-cid]')) {
      const cid = el.getAttribute('data-cid');
      if (want.has(cid)) { el.classList.add('sel'); found.add(cid); }
    }
    S.selected = S.selected.filter(cid => found.has(cid));
  }
  $('selInfo').textContent = S.selected.length > 12
    ? `${S.selected.length}개 선택됨` : (S.selected.join(', ') || '없음');
}
function select(cid, additive) {
  if (!additive) { S.selected = []; $('stage').querySelectorAll('.sel').forEach(e=>e.classList.remove('sel')); }
  if (cid && !S.selected.includes(cid)) S.selected.push(cid);
  restoreSelection();
  syncSession(true);
}

// preview overlay
function preview() {
  const o = $('overlay'); o.innerHTML = '';
  if (S.pts.length < 1) return;
  const ns = 'http://www.w3.org/2000/svg';
  const el = document.createElementNS(ns, 'polyline');
  el.setAttribute('points', S.pts.map(p=>p.join(',')).join(' '));
  el.setAttribute('stroke', $('strokeColor').value); el.setAttribute('fill','none');
  el.setAttribute('stroke-width', $('strokeWidth').value); el.setAttribute('stroke-dasharray','6 4');
  o.appendChild(el);
}
function resetDraw() { S.pts = []; S.drawing = false; preview(); }

$('viewport').addEventListener('click', async evt => {
  if (S.suppressClick) { S.suppressClick = false; return; }   // 러버밴드 직후 click 무시
  let p = svgPoint(evt); if (!p) return;
  const t = S.tool;
  if (t !== 'select' && t !== 'copy' && t !== 'stylecopy') p = snapPoint(p, evt);
  if (t === 'select') {
    const hit = evt.target.closest('[data-cid]');
    const additive = evt.shiftKey || evt.ctrlKey || evt.metaKey;
    if (!hit) { select(null, additive); }
    else {
      // CAD 도면은 같은 자리에 동일 요소가 2~3겹 → 지오메트리가 완전히 같은 쌍둥이를 함께 선택
      const GEO = { line:['x1','y1','x2','y2'], polyline:['points'], polygon:['points'],
                    path:['d'], rect:['x','y','width','height'], circle:['cx','cy','r'],
                    ellipse:['cx','cy','rx','ry'] };
      const keys = GEO[hit.tagName];
      select(hit.getAttribute('data-cid'), additive);
      if (keys) {
        const sig = keys.map(k => hit.getAttribute(k)).join('|') + '|' + (hit.getAttribute('transform')||'');
        let n = 0;
        $('stage').querySelectorAll(hit.tagName + '[data-cid]').forEach(e => {
          if (e !== hit && keys.map(k => e.getAttribute(k)).join('|') + '|' + (e.getAttribute('transform')||'') === sig) {
            select(e.getAttribute('data-cid'), true); n++;
          }
        });
        if (n) log(`겹친 동일 요소 ${n}개 함께 선택됨 (합계 ${S.selected.length})`);
      }
    }
  } else if (t === 'copy') {
    const hit = evt.target.closest('[data-cid]');
    if (!S.copySource) { if (hit) { S.copySource = { cid:hit.getAttribute('data-cid'), p }; log('복사 원본 선택 — 붙여넣을 위치 클릭'); } }
    else { await op('copy_element', { cid:S.copySource.cid, dx:p[0]-S.copySource.p[0], dy:p[1]-S.copySource.p[1] }); S.copySource = null; }
  } else if (t === 'stylecopy') {
    const hit = evt.target.closest('[data-cid]'); if (!hit) return;
    const cid = hit.getAttribute('data-cid');
    if (!S.styleSource) { S.styleSource = cid; log('스타일 원본: '+cid+' — 적용할 요소 클릭'); }
    else { await op('copy_style', { source_cid:S.styleSource, target_cids:[cid] }); S.styleSource = null; }
  } else if (t === 'text') {
    const text = window.prompt('텍스트'); if (text) await op('add_text', { x:p[0], y:p[1], text, style:{ fill:$('strokeColor').value } });
  } else if (t === 'line' || t === 'rect' || t === 'ellipse') {
    S.pts.push(p); S.drawing = true; preview();
    if (S.pts.length === 2) {
      const [a,b] = S.pts; resetDraw();
      if (t==='line') await op('draw_line', { x1:a[0], y1:a[1], x2:b[0], y2:b[1], style:style() });
      if (t==='rect') await op('draw_rect', { x:Math.min(a[0],b[0]), y:Math.min(a[1],b[1]), width:Math.abs(b[0]-a[0]), height:Math.abs(b[1]-a[1]), style:style() });
      if (t==='ellipse') await op('draw_ellipse', { cx:a[0], cy:a[1], rx:Math.hypot(b[0]-a[0], b[1]-a[1]), style:style() });
    }
  } else if (t === 'polyline' || t === 'curve' || t === 'zone') {
    S.pts.push(p); S.drawing = true; preview();
  }
});

async function finishMulti() {
  const t = S.tool, pts = S.pts.slice(); resetDraw();
  if (pts.length < 2) return;
  if (t === 'polyline') await op('draw_polyline', { points:pts, style:style() });
  else if (t === 'curve' && pts.length >= 3) await op('draw_curve', { points:pts, style:style() });
  else if (t === 'zone' && pts.length >= 3) await op('set_zone', { mode:$('zoneMode').value, points:pts });
}
$('viewport').addEventListener('dblclick', finishMulti);
$('viewport').addEventListener('contextmenu', evt => { evt.preventDefault(); if (S.drawing) finishMulti(); });
document.addEventListener('keydown', evt => {
  if (evt.key === 'Enter' && S.drawing) finishMulti();
  if (evt.key === 'Escape') { resetDraw(); S.styleSource = S.copySource = null; }
  if ((evt.key === 'Delete' || evt.key === 'Backspace') && S.selected.length && S.tool === 'select'
      && document.activeElement.tagName !== 'INPUT') {
    op('delete_elements', { cids:S.selected.slice() }); S.selected = [];
  }
});

document.querySelectorAll('#tools button').forEach(btn => btn.addEventListener('click', () => {
  if (S.drawing && S.pts.length >= 2) finishMulti();   // 도구 전환 시 그리던 도형 자동 확정
  document.querySelectorAll('#tools button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active'); S.tool = btn.dataset.tool; resetDraw();
}));

$('btnOpen').onclick = async () => {
  const r = await api('/api/open', { path: $('svgPath').value.trim() });
  if (r.status === 'error') log('오류: ' + r.error); else { log('로드됨: ' + $('svgPath').value); S.view = null; poll(true); }
};
$('btnBrowse').onclick = async () => {
  log('파인더에서 SVG 파일을 선택하세요… (창이 안 보이면 다른 창 뒤를 확인)');
  const r = await api('/api/pick-file', {});
  if (r.status === 'ok') { $('svgPath').value = r.path; log('로드됨: ' + r.path); S.view = null; poll(true); }
  else if (r.status === 'cancelled') log('파일 선택 취소됨');
  else { log('네이티브 선택창 실패(' + (r.error || '?') + ') — 브라우저 선택창으로 대체합니다'); $('filePick').click(); }
};
$('filePick').onchange = async evt => {
  const f = evt.target.files[0]; if (!f) return;
  const svg = await f.text();
  const r = await api('/api/open-text', { svg, name: f.name });
  if (r.status === 'ok') {
    if (r.path) $('svgPath').value = r.path;
    log('로드됨(업로드): ' + f.name + (r.path ? ' — 저장 시 ' + r.path : ''));
    S.view = null; poll(true);
  } else log('오류: ' + (r.error || '업로드 실패'));
  evt.target.value = '';
};
$('btnSave').onclick = async () => { const r = await api('/api/save', {}); log(r.status==='ok' ? '저장됨: '+r.saved : '오류: '+r.error); };
$('btnDxf').onclick = async () => {
  log('DXF 내보내는 중…');
  const r = await api('/api/export', { format: 'dxf' });
  if (r.status === 'ok') {
    const n = Object.values(r.entities||{}).reduce((a,b)=>a+b,0);
    log('DXF 내보냄: ' + r.dxf + ' (요소 ' + n + '개, 단위 ' + r.units + ')');
  } else log('오류: ' + r.error);
};
document.addEventListener('keydown', evt => {
  if ((evt.metaKey || evt.ctrlKey) && evt.key === 's') { evt.preventDefault(); $('btnSave').click(); }
});
$('btnUndo').onclick = async () => { const r = await api('/api/undo', {}); if (r.status==='error') log('오류: '+r.error); poll(true); };
$('btnFit').onclick = () => { S.view = null; applyView(); };
$('btnSnap').onclick = () => { S.snap = !S.snap; $('btnSnap').classList.toggle('active', S.snap); log('스냅 ' + (S.snap ? '켜짐 (끝점>직교(Shift)>그리드)' : '꺼짐')); };
// ---- 선택 변형: 이동·회전·스케일·복제·배열 ----
const needSel = () => { if (!S.selected.length) { log('먼저 요소를 선택하세요'); return false; } return true; };
const xform = params => op('transform_elements', { cids: S.selected.slice(), ...params });
$('btnMove').onclick = () => {
  if (!needSel()) return;
  const v = window.prompt('이동량 dx,dy (도면 단위 · 예: 20,-10)', '10,0'); if (!v) return;
  const [dx, dy] = v.split(',').map(Number);
  if (isNaN(dx) || isNaN(dy)) { log('형식: dx,dy'); return; }
  xform({ dx, dy });
};
$('btnRotate').onclick = () => {
  if (!needSel()) return;
  const v = window.prompt('회전 각도 (도 · 시계방향, 예: 90)', '90'); if (!v) return;
  const a = Number(v); if (isNaN(a)) { log('숫자를 입력하세요'); return; }
  xform({ rotate: a });
};
$('btnScale').onclick = () => {
  if (!needSel()) return;
  const v = window.prompt('배율 (예: 1.5 = 150%)', '1.5'); if (!v) return;
  const s = Number(v); if (isNaN(s) || s === 0) { log('0이 아닌 숫자를 입력하세요'); return; }
  xform({ scale: s });
};
$('btnDup').onclick = async () => {
  if (!needSel()) return;
  const r = await op('array_elements', { cids: S.selected.slice(), count: 2, dx: 15, dy: 15 });
  if (r && r.status === 'ok' && r.created) { select(null, false); r.created.forEach(c => select(c, true)); log(`⧉ 복제됨 — 새 사본이 선택됨 (드래그로 이동)`); }
};
$('btnArray').onclick = () => {
  if (!needSel()) return;
  const v = window.prompt('배열: 열,열간격x,열간격y[,행,행간격y] (예: 5,30,0,2,25)', '4,30,0'); if (!v) return;
  const [count, dx, dy, rows, rdy] = v.split(',').map(Number);
  if (!count || isNaN(dx)) { log('형식: 열,간격x,간격y'); return; }
  op('array_elements', { cids: S.selected.slice(), count, dx, dy: dy || 0,
                         rows: rows || 1, row_dy: rdy || 0 });
};

// 드래그 이동: 선택 도구에서, 이미 선택된 요소 위에서 드래그 시작 → 선택 전체 이동
$('viewport').addEventListener('pointerdown', evt => {
  if (evt.button !== 0 || S.tool !== 'select' || evt.altKey || S.spaceDown || evt.shiftKey || evt.ctrlKey || evt.metaKey) return;
  const hit = evt.target.closest && evt.target.closest('[data-cid]');
  if (!hit || !S.selected.includes(hit.getAttribute('data-cid'))) return;
  evt.stopImmediatePropagation();          // 러버밴드 시작 차단
  const svg0 = $('stage').querySelector('svg'); if (!svg0) return;
  const ctm0 = svg0.getScreenCTM().inverse();
  const toW = e => { const p = svg0.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(ctm0); };
  const start = toW(evt);
  const targets = S.selected.map(cid => $('stage').querySelector(`[data-cid="${cid}"]`)).filter(Boolean);
  let last = { x: 0, y: 0 }, moved = false;
  const move = e2 => {
    const p = toW(e2);
    last = { x: p.x - start.x, y: p.y - start.y };
    if (!moved && Math.hypot(last.x, last.y) < 1) return;
    moved = true;
    targets.forEach(el => el.setAttribute('data-drag', `translate(${last.x},${last.y})`) ||
                          el.style.setProperty('transform', `translate(${last.x}px,${last.y}px)`));
  };
  const up = async () => {
    window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up);
    targets.forEach(el => { el.style.removeProperty('transform'); el.removeAttribute('data-drag'); });
    if (moved) { S.suppressClick = true; await xform({ dx: Math.round(last.x * 100) / 100, dy: Math.round(last.y * 100) / 100 }); }
  };
  window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
}, true);   // capture: 러버밴드 리스너보다 먼저

$('btnDelete').onclick = () => {
  if (!S.selected.length) { log('삭제할 요소를 먼저 선택하세요 (Ctrl/Cmd/Shift+클릭 = 복수 선택)'); return; }
  const n = S.selected.length;
  op('delete_elements', { cids:S.selected.slice() });
  S.selected = []; syncSession(true);
  log(`🗑 ${n}개 요소 삭제`);
};
$('btnSend').onclick = async () => {
  const text = $('prompt').value.trim(); if (!text) { log('보낼 메시지를 입력하세요'); return; }
  const r = await api('/api/message', { text });
  if (r.status === 'ok') { log('💬 에이전트에게 전달됨: ' + text); $('prompt').value = ''; }
  else log('오류: ' + r.error);
};
$('prompt').addEventListener('keydown', evt => { if (evt.key === 'Enter') $('btnSend').click(); });
$('btnRegen').onclick = async () => {
  const prompt = $('prompt').value.trim(); if (!prompt) { log('재생성: 프롬프트를 입력하세요'); return; }
  log('재생성 실행 중… (수 분 걸릴 수 있음)'); $('btnRegen').disabled = true;
  try {
    const r = await api('/api/regenerate', { prompt });
    log('재생성 결과: ' + (r.status||'unknown') + (r.report && r.report.blocking && r.report.blocking.length ? "\n- " + r.report.blocking.join("\n- ") : ''));
  } catch (e) { log('재생성 오류: ' + e); }
  $('btnRegen').disabled = false; poll(true);
};
window.CrabCanvas = {
  api,
  log,
  getRevision: () => S.rev,
  getSourcePath: () => S.sourcePath || null,
  getSvgRoot: () => $('stage').querySelector('svg'),
  getSelectedCids: () => S.selected.slice(),
  selectCid: cid => select(cid, false),
};
window.dispatchEvent(new CustomEvent('crab-canvas-ready'));
</script>
